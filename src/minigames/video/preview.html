<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Монтажная — стенд</title>
    <style>
      .ve-stand {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }
      .ve-stand-box {
        width: min(560px, 100%);
      }
      .ve-stand-log {
        margin: 0;
        padding: 12px;
        max-height: 220px;
        overflow: auto;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--glass-strong);
        color: var(--paper-dim);
        font: 12.8px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
      }
      .ve-stand-dev {
        position: fixed;
        right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        z-index: 80;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }
      .ve-stand-dev .panel {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 220px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./preview.tsx"></script>
  </body>
</html>
